name: Publicar manual

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-production
  cancel-in-progress: true

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          mkdocs build --strict --clean
          cp site/index.html site/manual.html
          python - <<'PY'
          from pathlib import Path

          page = Path("site/manual.html")
          page.write_text(page.read_text().replace("../", "manual/"))
          PY

      - name: Configurar SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Asegurar directorio remoto
        shell: bash
        run: |
          set -euo pipefail
          ssh -p 22 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'mkdir -p ~/httpdocs/app-prod/storage/app/public/manual'

      - name: Sincronizar manual
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -p 22 -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            site/ "$DEPLOY_USER@$DEPLOY_HOST:~/httpdocs/app-prod/storage/app/public/manual/"

          rsync -az \
            -e "ssh -p 22 -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            site/manual.html "$DEPLOY_USER@$DEPLOY_HOST:~/httpdocs/app-prod/storage/app/public/manual.html"

      - name: Comprobar publicación HTTPS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            https://yures.puyu.pe/storage/manual.html
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            https://yures.puyu.pe/storage/manual/stylesheets/extra.css
